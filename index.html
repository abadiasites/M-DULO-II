<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copa Dos Davis</title>
  <style>
    /* Configurações da Tela Branca */
    body {
      margin: 0;
      padding: 40px 20px;
      background-color: #ffffff;
      min-height: 100vh;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    /* Container centralizado para as 3 imagens empilhadas */
    .stack-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Estilo padrão das imagens */
    .img-box {
      width: 100%;
      max-width: 400px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      display: block;
    }

    /* 4ª Imagem fixada no canto inferior esquerdo */
    .fixed-left-bottom {
      position: fixed;
      left: 20px;
      bottom: 20px;
      width: 120px;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- 3 Imagens Empilhadas -->
  <div class="stack-container">
    <img class="img-box" src="https://i.postimg.cc/0QnCnTdM/1361-Sem-Titulo-20260829204119.png" alt="Postimage 1">
    <img class="img-box" src="https://i.postimg.cc/52QnJkbd/JPm-UQt.gif" alt="Postimage 2">
    <img class="img-box" src="https://i.postimg.cc/cC5Byfz4/Screenshot-20260829-203920.png" alt="Postimage 3">
  </div>

  <!-- 4ª Imagem no Canto Inferior Esquerdo -->
  <img class="fixed-left-bottom" src="https://i.postimg.cc/placeholder4.jpg" alt="Postimage 4">

</body>
</html>
